<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURNTALE 세로 컷씬 3차 수정안</title>
<style>body{margin:0;background:#111b20;color:#f2e9d6;font:16px system-ui}header{position:sticky;top:0;background:#111b20f5;padding:16px;z-index:1;border-bottom:1px solid #8d8060}h1{font-size:20px;margin:0 0 12px}nav{display:flex;gap:10px;flex-wrap:wrap}select,button,a{font:inherit;padding:10px;border:1px solid #a8996c;border-radius:6px;background:#263b37;color:#fff0d0}button[aria-pressed=true]{background:#b69b5b;color:#111}main{max-width:600px;margin:18px auto;padding:0 12px}img{display:block;width:100%;height:auto}p{line-height:1.6}a{display:inline-block;margin:12px 0}</style>
<header><h1>세로 컷씬 3차 수정안</h1><nav><select id="scene" aria-label="장면 선택"><option value="alley-thief">시장 뒤 골목 · 작은 두꺼운 패</option><option value="traveler-aided">약초 전달 후 · 자연스러운 팔</option><option value="watchtower-arrival">파수탑 · 돌 뒤에 숨은 빛</option><option value="blue-glass-discovery">발견 · 가려진 돌틈 안쪽</option></select><button id="before" aria-pressed="false">이전 2차</button><button id="after" aria-pressed="true">수정 3차</button></nav></header>
<main><p id="note"></p><img id="art" alt="선택한 퀘스트 컷씬"><a id="full" target="_blank" rel="noopener">원본 크기로 열기</a></main>
<script>const scene=document.getElementById('scene'),art=document.getElementById('art'),before=document.getElementById('before'),after=document.getElementById('after'),full=document.getElementById('full'),note=document.getElementById('note');let version=3;const notes={'alley-thief':'기존 게임처럼 작은 크기와 두께가 있는 상아색 패','traveler-aided':'주화를 건네는 손은 유지하고 반대 팔은 무릎 위에 자연스럽게 내려놓기','watchtower-arrival':'열린 길 위가 아닌, 성벽과 무너진 계단 사이의 가려진 틈에서 희미한 빛','blue-glass-discovery':'돌에 가려진 좁은 공간을 가까이 들여다보며 조사하기'};function render(){const src='./'+scene.value+'-portrait-v'+version+'.png';art.src=src;art.alt=scene.options[scene.selectedIndex].text;full.href=src;note.textContent=notes[scene.value];before.setAttribute('aria-pressed',String(version===2));after.setAttribute('aria-pressed',String(version===3));}scene.onchange=render;before.onclick=()=>{version=2;render()};after.onclick=()=>{version=3;render()};render();</script></html>
