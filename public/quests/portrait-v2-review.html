<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURNTALE 세로 컷씬 수정안</title>
<style>body{margin:0;background:#111b20;color:#f2e9d6;font:16px system-ui}header{position:sticky;top:0;background:#111b20f5;padding:16px;z-index:1;border-bottom:1px solid #8d8060}h1{font-size:20px;margin:0 0 12px}nav{display:flex;gap:10px;flex-wrap:wrap}select,button,a{font:inherit;padding:10px;border:1px solid #a8996c;border-radius:6px;background:#263b37;color:#fff0d0}button[aria-pressed=true]{background:#b69b5b;color:#111}main{max-width:600px;margin:18px auto;padding:0 12px}img{display:block;width:100%;height:auto}p{line-height:1.6}a{display:inline-block;margin:12px 0}</style>
<header><h1>세로 컷씬 수정안 · 가로판은 기존 유지</h1><a href="./portrait-v3-review.html">최신 3차 수정안 보기</a><nav><select id="scene" aria-label="장면 선택"><option value="alley-thief">시장 뒤 골목 · 도둑</option><option value="traveler-injured">약초 전달 전</option><option value="traveler-aided">약초 전달 후</option><option value="watchtower-arrival">파수탑 전경</option><option value="blue-glass-discovery">푸른 유리 발견</option></select><button id="before" aria-pressed="false">이전 그림</button><button id="after" aria-pressed="true">세로 수정안</button></nav></header>
<main><p id="note"></p><img id="art" alt="선택한 퀘스트 컷씬"><a id="full" target="_blank" rel="noopener">원본 크기로 열기</a></main>
<script>const scene=document.getElementById('scene'),art=document.getElementById('art'),before=document.getElementById('before'),after=document.getElementById('after'),full=document.getElementById('full'),note=document.getElementById('note');let version=2;const notes={'alley-thief':'성벽 안 골목과 지면에 닿는 두 발','traveler-injured':'성벽 안 수레 쉼터와 밤의 밝기 기준','traveler-aided':'동일한 쉼터·밤의 밝기를 유지한 약초 전달 후','watchtower-arrival':'성 안 안뜰의 파수탑과 바닥에 쓰러진 작은 등잔','blue-glass-discovery':'같은 등잔과 바닥을 가까이 내려다보며 유리를 꺼내는 장면'};function render(){const src='./'+scene.value+'-portrait-v'+version+'.png';art.src=src;art.alt=scene.options[scene.selectedIndex].text;full.href=src;note.textContent=notes[scene.value];before.setAttribute('aria-pressed',String(version===1));after.setAttribute('aria-pressed',String(version===2));}scene.onchange=render;before.onclick=()=>{version=1;render()};after.onclick=()=>{version=2;render()};render();</script></html>
